services:
  - type: web
    runtime: static
    name: bhuvan-teja-portfolio
    branch: main
    buildCommand: ./scripts/build-static.sh
    staticPublishPath: ./dist
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
