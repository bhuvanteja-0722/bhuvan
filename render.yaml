services:
  - type: web
    runtime: static
    name: bhuvan-teja-portfolio
    branch: main
    buildCommand: npm ci && ./scripts/build-static.sh
    staticPublishPath: ./dist
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /portfolio-data.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
